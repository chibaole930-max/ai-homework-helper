services:
  - type: web
    name: ai-homework-helper
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_AUTOSTART
        value: "1"
      - key: NODE_ENV
        value: "production"